<main class="login-panel">
  <h1>{{ registro ? 'Crear cuenta' : 'Iniciar sesión' }}</h1>
  <p>Accede con tu correo y contraseña.</p>
  <form #form="ngForm" (ngSubmit)="enviar()" [attr.aria-busy]="cargando">
    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" autocomplete="email"
      [(ngModel)]="email" required email [disabled]="cargando">

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password"
      [attr.autocomplete]="registro ? 'new-password' : 'current-password'"
      [(ngModel)]="password" required minlength="6" [disabled]="cargando">
    <small *ngIf="registro">Usa al menos 6 caracteres.</small>

    <p *ngIf="error" class="login-error" role="alert">{{ error }}</p>
    <button type="submit" [disabled]="form.invalid || cargando">
      {{ cargando ? 'Procesando…' : (registro ? 'Crear cuenta' : 'Entrar') }}
    </button>
  </form>
  <button type="button" class="cambiar-modo" (click)="cambiarModo()" [disabled]="cargando">
    {{ registro ? 'Ya tengo cuenta: iniciar sesión' : 'No tengo cuenta: registrarme' }}
  </button>
</main>
